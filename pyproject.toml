# FTIR Contamination Analyzer - project definition
# Author: Ali Obeidat

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ftir-contamination-analyzer"
version = "2.0.0"
description = "Identify contamination from FTIR spectra: library search, raw-spectrum checks, band evidence and traceable reports."
readme = "README.md"
authors = [{ name = "Ali Obeidat" }]
maintainers = [{ name = "Ali Obeidat" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "plotly>=5.20",
    "nbformat>=4.2",
    "PySide6-Essentials>=6.6",
    "rdata>=0.11",
    "openpyxl>=3.1",
    "jcamp>=1.3",
    "brukeropus>=1.4",
]
keywords = ["FTIR", "spectroscopy", "contamination", "failure analysis", "semiconductor", "quality"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.gui-scripts]
ftir-analyzer = "ftir_analyzer.__main__:main"

[tool.setuptools]
packages = ["ftir_analyzer", "ftir_analyzer.examples", "ftir_analyzer.examples.library_demo", "ftir_analyzer.examples.trends_demo"]

[tool.setuptools.package-dir]
"ftir_analyzer.examples" = "examples"
"ftir_analyzer.examples.library_demo" = "examples/library_demo"
"ftir_analyzer.examples.trends_demo" = "examples/trends_demo"

[tool.setuptools.package-data]
ftir_analyzer = ["data/*.csv", "data/*.json", "data/*.md", "assets/*.*", "assets/fonts/*", "assets/icons/*", "assets/js/*"]
"ftir_analyzer.examples" = ["*.csv", "*.md"]
"ftir_analyzer.examples.library_demo" = ["*"]
"ftir_analyzer.examples.trends_demo" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
